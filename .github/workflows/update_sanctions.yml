name: Update Sanctions CSV

on:
  schedule:
    - cron: '0 4 * * *'  # Щодня о 4:00 UTC (6:00 за Києвом)
  workflow_dispatch:      # Також можна запустити вручну

jobs:
  update-sanctions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download sanctions CSV files
        run: |
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://drs.nsdc.gov.ua/" \
            -o sanctions_legal.csv \
            "https://drs.nsdc.gov.ua/registry-api/subjects/export/legal/csv?lang=uk"
          
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://drs.nsdc.gov.ua/" \
            -o sanctions_individual.csv \
            "https://drs.nsdc.gov.ua/registry-api/subjects/export/individual/csv?lang=uk"

          echo "=== ПЕРШІ 3 РЯДКИ LEGAL ==="
          head -3 sanctions_legal.csv
          echo "Legal rows: $(wc -l < sanctions_legal.csv)"
          echo "Individual rows: $(wc -l < sanctions_individual.csv)"

      - name: Upload CSV to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "sanctions_legal.csv,sanctions_individual.csv"
          target: "/root/bankrupt_bot/"
